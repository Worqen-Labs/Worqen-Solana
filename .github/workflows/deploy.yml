name: Deploy (devnet)

# Continuous deployment to DEVNET. Manual trigger (or call from another
# workflow). Upgrades the existing program in place, refreshes the on-chain
# IDL, and runs the full test suite against the live program as a smoke gate.
#
# Required repository/environment secret (GitHub > Settings > Environments > devnet):
#   DEVNET_AUTHORITY_KEYPAIR  - JSON byte-array of the program's devnet upgrade
#                               authority keypair (also used as deploy fee payer).
#
# MAINNET is intentionally NOT auto-deployed here — its upgrade authority is a
# Squads multisig that cannot sign non-interactively. Use the `Release`
# workflow, which produces a verifiable build + a buffer for the multisig.

on:
  workflow_dispatch: {}

concurrency:
  group: deploy-devnet
  cancel-in-progress: false

env:
  SOLANA_VERSION: "4.0.0"
  ANCHOR_VERSION: "1.1.2"
  CLUSTER_URL: "https://api.devnet.solana.com"

jobs:
  deploy:
    name: build → upgrade → verify
    runs-on: ubuntu-latest
    environment: devnet
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Solana CLI (Agave)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor (avm)
        run: |
          cargo install --git https://github.com/solana-foundation/anchor avm --force --locked
          avm install ${ANCHOR_VERSION}
          avm use ${ANCHOR_VERSION}

      - uses: oven-sh/setup-bun@v2
      - name: Install JS deps
        run: bun install --frozen-lockfile

      # Two artifacts: `anchor build` gives the IDL plus the default-arch .so the
      # LiteSVM smoke test loads; `make build-deploy` gives the SBPFv3 .so that
      # is actually uploaded (~154 KB smaller). Anchor's CLI pins its own
      # platform-tools, so the arch flags cannot go through `anchor build`.
      - name: Build (IDL + LiteSVM artifact)
        run: anchor build

      - name: Build the SBPFv3 deployable
        run: make build-deploy

      - name: Resolve program id
        id: pid
        run: |
          PID=$(awk -F'"' '/^\[programs.devnet\]/{f=1} f&&/worqen_escrow/{print $2; exit}' Anchor.toml)
          echo "program_id=$PID" >> "$GITHUB_OUTPUT"
          echo "Program: $PID"

      - name: Load upgrade authority
        run: |
          install -m 600 /dev/null /tmp/authority.json
          printf '%s' "${{ secrets.DEVNET_AUTHORITY_KEYPAIR }}" > /tmp/authority.json
          solana config set --url "$CLUSTER_URL" --keypair /tmp/authority.json
          echo "Authority: $(solana address -k /tmp/authority.json)  balance: $(solana balance)"

      # SBPFv3 uploads need an Agave >= 4.0.0 client AND a cluster that has
      # activated SIMD-0377. The CLI refuses the upload against a cluster that
      # has not, so a stale devnet fails this step instead of bricking the
      # program.
      - name: Upgrade program (SBPFv3 artifact)
        run: |
          anchor upgrade target/deploy-v3/worqen_escrow.so \
            --program-id ${{ steps.pid.outputs.program_id }} \
            --provider.cluster "$CLUSTER_URL" \
            --provider.wallet /tmp/authority.json

      # Anchor 1.x stores the IDL in the Program Metadata Program, not in a
      # program-owned legacy account, so the first run after the upgrade has
      # nothing to upgrade and must `init` instead. See solana/CLAUDE.md for the
      # one-time `anchor-0.32.1 idl close` that must precede the 1.x rollout.
      - name: Refresh on-chain IDL
        run: |
          anchor idl upgrade ${{ steps.pid.outputs.program_id }} \
            -f target/idl/worqen_escrow.json \
            --provider.cluster "$CLUSTER_URL" \
            --provider.wallet /tmp/authority.json \
          || anchor idl init ${{ steps.pid.outputs.program_id }} \
            -f target/idl/worqen_escrow.json \
            --provider.cluster "$CLUSTER_URL" \
            --provider.wallet /tmp/authority.json

      # LiteSVM 1.1.0 cannot load an SBPFv3 .so, so the smoke test runs against
      # the default-arch build of the same source, not the uploaded bytes.
      - name: Smoke test the built artifact (LiteSVM, in-process, default arch)
        run: bun test

      - name: Scrub authority key
        if: always()
        run: shred -u /tmp/authority.json || rm -f /tmp/authority.json
